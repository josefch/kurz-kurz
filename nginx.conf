# Served behind Coolify's Traefik (coolify-proxy), which terminates TLS.

# Filenames are not fingerprinted: html/css/js always revalidate (ETag -> 304),
# the cyclist SVGs under /assets/ may be cached for a day.
map $uri $cache_control {
    default     "no-cache";
    ~^/assets/  "public, max-age=86400";
}

server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # www.kurzkurz.cc -> kurzkurz.cc, www.gehtheutekurzkurz.cc -> gehtheutekurzkurz.cc
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Docker HEALTHCHECK target (and Coolify, if its health check is ever switched on).
    location = /api/health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
